<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosk Yönetim Paneli</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #2c3e50; margin-top: 0; }
        .upload-card { border: 2px dashed #cbd5e1; padding: 30px; text-align: center; border-radius: 8px; background: #f8fafc; cursor: pointer; margin-bottom: 25px; }
        .upload-card:hover { border-color: #3b82f6; background: #eff6ff; }
        input[type="file"] { display: none; }
        .btn { background: #2563eb; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .btn:hover { background: #1d4ed8; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin-top: 15px; }
        .card { border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden; background: white; display: flex; flex-direction: column; }
        .card img { width: 100%; height: 120px; object-fit: cover; }
        .card-actions { padding: 8px; display: flex; justify-content: space-between; background: #f8fafc; }
        .btn-small { padding: 4px 8px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; }
        .btn-send { background: #10b981; color: white; }
        .btn-delete { background: #ef4444; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖥️ Kiosk Görsel Yönetim Paneli</h1>
        
        <!-- Yükleme Alanı -->
        <div class="upload-card" onclick="document.getElementById('fileInput').click()">
            <p>📁 Yeni resim yüklemek için tıklayın veya sürükleyip bırakın</p>
            <input type="file" id="fileInput" accept="image/*" onchange="uploadImage(event)">
            <button class="btn">Resim Seç & Yükle</button>
        </div>

        <h2>Galeri</h2>
        <div class="grid" id="imageGrid"></div>
    </div>

    <script>
        async function loadImages() {
            const res = await fetch('/api/images');
            const images = await res.json();
            const grid = document.getElementById('imageGrid');
            grid.innerHTML = '';

            images.forEach(img => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div style="padding:8px; font-size:11px; word-break:break-all; color:#64748b;">${img}</div>
                    <div class="card-actions">
                        <button class="btn-small btn-send" onclick="broadcast('${img}')">Ekrana Gönder</button>
                        <button class="btn-small btn-delete" onclick="deleteImage('${img}')">Sil</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function uploadImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('image', file);

            await fetch('/api/upload', { method: 'POST', body: formData });
            loadImages();
        }

        async function broadcast(name) {
            await fetch(`/api/broadcast/${name}`, { method: 'POST' });
            alert('Görsel Kiosk ekranlarına gönderildi!');
        }

        async function deleteImage(name) {
            if (!confirm('Bu resmi silmek istediğinize emin misiniz?')) return;
            await fetch(`/api/images/${name}`, { method: 'DELETE' });
            loadImages();
        }

        loadImages();
    </script>
</body>
</html>
